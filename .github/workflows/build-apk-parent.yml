name: Build APK — Espace Parent

# Se déclenche à la demande depuis l'onglet "Actions" de GitHub (bouton
# "Run workflow"). Peut aussi se déclencher automatiquement sur un tag
# (ex. v1.0.1) si tu préfères — décommente la section "push" ci-dessous.
on:
  workflow_dispatch: {}
  # push:
  #   tags:
  #     - "parent-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restaurer la clé de signature
        working-directory: android-twa
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Initialiser le projet Android (première exécution seulement)
        working-directory: android-twa
        run: |
          if [ ! -d "app" ]; then
            bubblewrap init --manifest twa-manifest.json --skipPwaValidation
          fi

      - name: Construire l'APK
        working-directory: android-twa
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build \
            --skipPwaValidation \
            --signingKeyPassword="$ANDROID_KEYSTORE_PASSWORD" \
            --signingKeyAliasPassword="$ANDROID_KEY_PASSWORD"

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: mdm-parent-apk
          path: android-twa/app-release-signed.apk
